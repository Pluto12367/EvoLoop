name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    env:
      EVOLOOP_REQUIRE_DOCKER: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Check packaged benchmark resources
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -I - <<'PY'
          from pathlib import Path
          import sys
          import zipfile
          wheel = next(Path('dist').glob('evoloop-*.whl')).resolve()
          with zipfile.ZipFile(wheel) as archive:
              assert 'evoloop/data/core_v1.json' in archive.namelist()
              assert not any(name.startswith('tests/') for name in archive.namelist())
          sys.path.insert(0, str(wheel))
          from evoloop.benchmark import load_benchmark
          core = load_benchmark('core')
          assert len(core.development) == 16 and len(core.holdout) == 8
          PY

      - name: Verify Docker and prepare execution image
        run: |
          docker info
          docker pull python:3.12-alpine

      - name: Run full test suite
        run: python -m pytest --strict-config --strict-markers --junitxml=test-results/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: test-results/pytest.xml
          if-no-files-found: warn
